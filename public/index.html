<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --border: #2a2f3a; --text: #e8eaf0;
    --muted: #9aa3b2; --accent: #4f8ef7; --green: #34c77b; --red: #e0596b; --amber: #e8a13c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; background: var(--bg); padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; z-index: 2; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .chip { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  #counter { margin-left: auto; font-size: 13px; color: var(--muted); }
  #counter.warn { color: var(--amber); font-weight: 600; }
  main { max-width: 880px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 15px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge.no_site { background: #2c1d2e; color: #e07ae0; }
  .badge.bad_site { background: #2e211d; color: var(--amber); }
  .badge.ok_site { background: #1d2a2e; color: #6cc7d8; }
  .badge.sent { background: #1d2e22; color: var(--green); }
  .badge.replied { background: #1d242e; color: var(--accent); }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .meta a { color: var(--accent); text-decoration: none; }
  textarea { width: 100%; margin-top: 10px; background: #11141a; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px; font: 13px/1.45 -apple-system, system-ui, sans-serif; resize: vertical; min-height: 64px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .ok { background: var(--green); color: #08130c; }
  .danger { background: transparent; border: 1px solid var(--border); color: var(--red); }
  input.ig { background: #11141a; border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 5px 8px; font-size: 13px; width: 160px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <h1>LeadFlow</h1>
  <div id="filters"></div>
  <span id="counter"></span>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const FILTERS = [
  ["new", "To contact"], ["no_site", "No website"], ["bad_site", "Bad site"],
  ["sent", "Sent"], ["replied", "Replied"], ["all", "All"],
];
let leads = [], active = "new", sentToday = 0;

const $ = (s) => document.querySelector(s);

function badge(cls, label) { return `<span class="badge ${cls}">${label}</span>`; }

function render() {
  $("#filters").innerHTML = FILTERS.map(([k, label]) =>
    `<button class="chip ${k === active ? "active" : ""}" onclick="setFilter('${k}')">${label}</button>`).join(" ");
  const counter = $("#counter");
  counter.textContent = `${sentToday} DMs sent today`;
  counter.className = sentToday >= 30 ? "warn" : "";
  if (sentToday >= 30) counter.textContent += " — slow down, ban territory";

  const shown = leads.filter((l) => {
    if (active === "all") return true;
    if (active === "new") return l.status === "new";
    if (active === "sent" || active === "replied") return l.status === active;
    return l.category === active && l.status === "new";
  });

  $("#list").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty">Nothing here. Run <code>npm run scan</code> to add leads.</div>`;
}

function card(l) {
  const cat = l.category ? badge(l.category, ({no_site:"NO SITE",bad_site:`WEAK SITE ${l.site_score}`,ok_site:`OK SITE ${l.site_score}`})[l.category]) : "";
  const st = l.status !== "new" ? badge(l.status, l.status.toUpperCase()) : "";
  return `<div class="card" id="lead-${l.id}">
    <div class="row">
      <span class="name">${esc(l.name)}</span> ${cat} ${st}
      ${l.rating ? `<span class="meta">★ ${l.rating}${l.reviews ? ` (${l.reviews})` : ""}</span>` : ""}
    </div>
    <div class="meta">
      ${esc(l.niche ?? "")} · ${esc(l.area ?? "")}
      ${l.website ? ` · <a href="${esc(l.website)}" target="_blank">site</a>` : ""}
      ${l.maps_url ? ` · <a href="${esc(l.maps_url)}" target="_blank">maps</a>` : ""}
      ${l.site_notes ? ` · ${esc(l.site_notes)}` : ""}
    </div>
    <div class="row" style="margin-top:8px">
      ${l.ig_handle
        ? `<a class="meta" href="https://instagram.com/${esc(l.ig_handle)}" target="_blank">@${esc(l.ig_handle)}</a>`
        : `<input class="ig" placeholder="@handle" onchange="saveIg(${l.id}, this.value)" />`}
    </div>
    <textarea onchange="saveMsg(${l.id}, this.value)">${esc(l.message ?? "")}</textarea>
    <div class="btns">
      <button class="primary" onclick="copyOpen(${l.id})">Copy msg + open IG</button>
      <button class="ok" onclick="setStatus(${l.id}, 'sent')">Mark sent</button>
      <button class="ghost" onclick="setStatus(${l.id}, 'replied')">Replied</button>
      <button class="danger" onclick="setStatus(${l.id}, 'skip')">Skip</button>
    </div>
  </div>`;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

window.setFilter = (k) => { active = k; render(); };

window.copyOpen = async (id) => {
  const l = leads.find((x) => x.id === id);
  if (l.message) await navigator.clipboard.writeText(l.message);
  if (l.ig_handle) window.open(`https://instagram.com/${l.ig_handle}`, "_blank");
};

window.setStatus = async (id, status) => {
  await fetch(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ status }) });
  await load();
};
window.saveMsg = (id, message) =>
  fetch(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ message }) });
window.saveIg = async (id, ig_handle) => {
  await fetch(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ ig_handle }) });
  await load();
};

async function load() {
  [leads, { sentToday }] = await Promise.all([
    fetch("/api/leads").then((r) => r.json()),
    fetch("/api/stats").then((r) => r.json()),
  ]);
  render();
}
load();
</script>
</body>
</html>
