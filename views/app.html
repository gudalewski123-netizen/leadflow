<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow</title>
<style>
  :root {
    --bg: #0c0e12; --card: #14171e; --border: #262b36; --text: #e8eaf0;
    --muted: #9aa3b2; --accent: #4f8ef7; --green: #34c77b; --red: #e0596b; --amber: #e8a13c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; background: rgba(12,14,18,.92); backdrop-filter: blur(8px);
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; z-index: 2;
  }
  .logo { display: flex; align-items: center; gap: 9px; margin-right: 8px; }
  .mark {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f8ef7, #7b5cf0); font-weight: 800; font-size: 14px;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.3px; }
  .chip { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  select.state {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #counter { font-size: 13px; color: var(--muted); }
  #counter.warn { color: var(--amber); font-weight: 600; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #statbar { max-width: 920px; margin: 18px auto 0; padding: 0 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 15px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge.no_site { background: #2c1d2e; color: #e07ae0; }
  .badge.bad_site { background: #2e211d; color: var(--amber); }
  .badge.ok_site { background: #1d2a2e; color: #6cc7d8; }
  .badge.sent { background: #1d2e22; color: var(--green); }
  .badge.replied { background: #1d242e; color: var(--accent); }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .meta a { color: var(--accent); text-decoration: none; }
  textarea { width: 100%; margin-top: 10px; background: #0e1117; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px; font: 13px/1.45 -apple-system, system-ui, sans-serif; resize: vertical; min-height: 64px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .ok { background: var(--green); color: #08130c; }
  .danger { background: transparent; border: 1px solid var(--border); color: var(--red); }
  input.ig { background: #0e1117; border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 5px 8px; font-size: 13px; width: 160px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="mark">L</div><h1>LeadFlow</h1></div>
  <div id="filters"></div>
  <select class="state" id="stateSel" onchange="setState(this.value)"></select>
  <select class="state" id="nicheSel" onchange="setNiche(this.value)"></select>
  <div class="right">
    <span id="counter"></span>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</header>
<div id="statbar"></div>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const FILTERS = [
  ["new", "To contact"], ["no_site", "No website"], ["bad_site", "Bad site"],
  ["sent", "Sent"], ["replied", "Replied"], ["all", "All"],
];
let leads = [], active = "no_site", stateFilter = "all", nicheFilter = "all", stats = {};
const US_STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];

const $ = (s) => document.querySelector(s);
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.reload(); throw new Error("unauthorized"); }
  return r.json();
};

function badge(cls, label) { return `<span class="badge ${cls}">${label}</span>`; }

function render() {
  $("#filters").innerHTML = FILTERS.map(([k, label]) =>
    `<button class="chip ${k === active ? "active" : ""}" onclick="setFilter('${k}')">${label}</button>`).join(" ");

  const counter = $("#counter");
  counter.textContent = `${stats.sent_today ?? 0} DMs today`;
  counter.className = (stats.sent_today ?? 0) >= 30 ? "warn" : "";
  if ((stats.sent_today ?? 0) >= 30) counter.textContent += " — slow down";

  $("#statbar").innerHTML = [
    [stats.total ?? 0, "Total leads"],
    [stats.to_contact ?? 0, "To contact"],
    [stats.no_site ?? 0, "No website"],
    [stats.sent_today ?? 0, "Sent today"],
    [stats.replied ?? 0, "Replied"],
  ].map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  // populate the state dropdown with per-state to-contact counts
  const counts = {};
  for (const l of leads) if (l.state && l.status === "new") counts[l.state] = (counts[l.state] ?? 0) + 1;
  const sel = $("#stateSel");
  sel.innerHTML = `<option value="all">All states (${leads.filter((l) => l.status === "new").length})</option>` +
    US_STATES.map((s) => `<option value="${s}" ${s === stateFilter ? "selected" : ""}>${s} (${counts[s] ?? 0})</option>`).join("");

  // populate the business-type dropdown from whatever niches are actually present
  const nicheCounts = {};
  for (const l of leads) if (l.niche && l.status === "new") nicheCounts[l.niche] = (nicheCounts[l.niche] ?? 0) + 1;
  const nicheList = Object.keys(nicheCounts).sort();
  const nsel = $("#nicheSel");
  nsel.innerHTML = `<option value="all">All types</option>` +
    nicheList.map((n) => `<option value="${n}" ${n === nicheFilter ? "selected" : ""}>${n} (${nicheCounts[n]})</option>`).join("");

  const shown = leads.filter((l) => {
    if (stateFilter !== "all" && l.state !== stateFilter) return false;
    if (nicheFilter !== "all" && l.niche !== nicheFilter) return false;
    if (active === "all") return true;
    if (active === "new") return l.status === "new";
    if (active === "sent" || active === "replied") return l.status === active;
    return l.category === active && l.status === "new";
  });

  $("#list").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty">Nothing here yet. Run a scan to add leads.</div>`;
}

function card(l) {
  const cat = l.category ? badge(l.category, ({no_site:"NO SITE",bad_site:`WEAK SITE ${l.site_score}`,ok_site:`OK SITE ${l.site_score}`})[l.category]) : "";
  const st = l.status !== "new" ? badge(l.status, l.status.toUpperCase()) : "";
  return `<div class="card" id="lead-${l.id}">
    <div class="row">
      <span class="name">${esc(l.name)}</span> ${cat} ${st}
      ${l.rating ? `<span class="meta">★ ${l.rating}${l.reviews ? ` (${l.reviews})` : ""}</span>` : ""}
    </div>
    <div class="meta">
      ${esc(l.niche ?? "")} · ${esc(l.area ?? "")}
      ${l.website ? ` · <a href="${esc(l.website)}" target="_blank" rel="noopener">site</a>` : ""}
      ${l.maps_url ? ` · <a href="${esc(l.maps_url)}" target="_blank" rel="noopener">maps</a>` : ""}
      ${l.site_notes ? ` · ${esc(l.site_notes)}` : ""}
    </div>
    <div class="row" style="margin-top:8px">
      ${l.ig_handle
        ? `<a class="meta" href="https://instagram.com/${esc(l.ig_handle)}" target="_blank" rel="noopener">@${esc(l.ig_handle)}</a>`
        : `<input class="ig" placeholder="@handle" onchange="saveIg(${l.id}, this.value)" />
           <button class="ghost" style="padding:5px 10px" onclick="findIg(${l.id})">🔎 Find on IG</button>`}
    </div>
    <textarea onchange="saveMsg(${l.id}, this.value)">${esc(l.message ?? "")}</textarea>
    <div class="btns">
      <button class="primary" onclick="copyOpen(${l.id})">Copy msg + open IG</button>
      <button class="ok" onclick="setStatus(${l.id}, 'sent')">Mark sent</button>
      <button class="ghost" onclick="setStatus(${l.id}, 'replied')">Replied</button>
      <button class="danger" onclick="setStatus(${l.id}, 'skip')">Skip</button>
    </div>
  </div>`;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

window.setFilter = (k) => { active = k; render(); };
window.setState = (s) => { stateFilter = s; render(); };
window.setNiche = (n) => { nicheFilter = n; render(); };

window.copyOpen = async (id) => {
  const l = leads.find((x) => x.id === id);
  if (l.message) await navigator.clipboard.writeText(l.message);
  if (l.ig_handle) window.open(`https://instagram.com/${l.ig_handle}`, "_blank");
};

window.setStatus = async (id, status) => {
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ status }) });
  await load();
};
window.saveMsg = (id, message) =>
  api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ message }) });
window.findIg = (id) => {
  const l = leads.find((x) => x.id === id);
  const q = encodeURIComponent(`${l.name} ${l.area ?? ""} instagram`);
  window.open(`https://www.google.com/search?q=${q}`, "_blank");
};
window.saveIg = async (id, ig_handle) => {
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ ig_handle }) });
  await load();
};
window.logout = async () => {
  await fetch("/api/logout", { method: "POST" });
  location.reload();
};

async function load() {
  [leads, stats] = await Promise.all([api("/api/leads"), api("/api/stats")]);
  render();
}
load();
</script>
</body>
</html>
