<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c; --surface: #141416; --surface-2: #1b1b1e; --border: #262629; --border-2: #34343a;
    --text: #f4f4f5; --muted: #8a8a93; --faint: #5e5e66;
    --accent: #46c79a; --accent-2: #5fd9ad; --accent-soft: rgba(70,199,154,.12);
    --red: #f87171; --amber: #e6c34d; --pink: #ff8fce; --sky: #5cb8f0;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-soft); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 10; background: rgba(11,11,12,.9); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .topbar, .toolbar { max-width: 1000px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar { gap: 10px; border-top: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent-2), #2fae82); color: #06140e; font-weight: 800; font-size: 15px; box-shadow: 0 2px 10px rgba(70,199,154,.25); }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.4px; font-weight: 700; }
  /* compact inline stats in the brand bar */
  #statbar { display: flex; gap: 7px; flex-wrap: wrap; margin-left: 6px; }
  .stat { display: flex; align-items: baseline; gap: 5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px; }
  .stat .n { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
  .stat.hot .n { color: var(--accent); }
  .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #counter { font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  #counter.warn { color: var(--amber); font-weight: 600; }
  .logout { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .12s; }
  .logout:hover { border-color: var(--border-2); color: var(--text); }
  /* segmented status filter */
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .chip { border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .12s; }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); color: #06140e; }
  .selects { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  select.state { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .12s; }
  select.state:hover { border-color: var(--border-2); }
  /* ---------- list ---------- */
  main { max-width: 1000px; margin: 18px auto 60px; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--border-2); }
  .chead { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .name { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }
  .rating { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
  .badge.no_site { background: rgba(255,143,206,.13); color: var(--pink); }
  .badge.bad_site { background: rgba(230,195,77,.12); color: var(--amber); }
  .badge.ok_site { background: rgba(92,184,240,.12); color: var(--sky); }
  .badge.sent { background: var(--accent-soft); color: var(--accent); }
  .badge.replied { background: rgba(92,184,240,.12); color: var(--sky); }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .meta a:hover { text-decoration: underline; }
  /* contact chips row */
  .contact { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; color: var(--text); text-decoration: none; }
  .pill.ig { color: var(--accent); }
  .pill:hover { border-color: var(--border-2); }
  textarea { width: 100%; margin-top: 11px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; font: 13.5px/1.5 'Inter', system-ui, sans-serif; resize: vertical; min-height: 66px; }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.ig { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 6px 10px; font-size: 12.5px; font-family: inherit; width: 150px; }
  input.ig:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* buttons */
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button { border: 0; border-radius: 9px; padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .12s; white-space: nowrap; }
  .primary { background: var(--accent); color: #06140e; }
  .primary:hover { background: var(--accent-2); }
  .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 12px; }
  .ghost:hover { border-color: var(--border-2); color: var(--text); }
  .ok { background: transparent; border: 1px solid rgba(70,199,154,.35); color: var(--accent); }
  .ok:hover { background: var(--accent-soft); }
  .danger { background: transparent; border: 1px solid var(--border); color: var(--faint); padding: 8px 12px; }
  .danger:hover { color: var(--red); border-color: rgba(248,113,113,.35); }
  .spacer { flex: 1; }
  .more { align-self: center; margin: 6px auto 0; }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; font-size: 14px; }
  @media (max-width: 640px) { .topbar { flex-wrap: wrap; height: auto; padding: 10px 16px; } #statbar { width: 100%; order: 3; } .toolbar { padding: 8px 16px; } }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo"><div class="mark">L</div><h1>LeadFlow</h1></div>
    <div id="statbar"></div>
    <div class="right">
      <span id="counter"></span>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </div>
  <div class="toolbar">
    <div id="filters" class="seg"></div>
    <div class="selects">
      <select class="state" id="countrySel" onchange="setCountry(this.value)"></select>
      <select class="state" id="stateSel" onchange="setState(this.value)"></select>
      <select class="state" id="nicheSel" onchange="setNiche(this.value)"></select>
      <select class="state" id="chanSel" onchange="setChan(this.value)"></select>
    </div>
  </div>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const FILTERS = [
  ["new", "To contact"], ["no_site", "No website"], ["bad_site", "Bad site"],
  ["sent", "Sent"], ["replied", "Replied"], ["all", "All"],
];
let leads = [], active = "no_site", stateFilter = "all", nicheFilter = "all", chanFilter = "all", stats = {};
let renderLimit = 60;
const US_STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
const COUNTRIES = ["United Kingdom","Ireland","Poland","Germany","France","Spain","Italy","Netherlands","Belgium","Portugal","Switzerland","Austria","Sweden","Norway","Denmark","Finland","Czechia","Romania","Greece","Canada","Mexico","Brazil","Australia","New Zealand","United Arab Emirates","South Africa"];

const $ = (s) => document.querySelector(s);
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.reload(); throw new Error("unauthorized"); }
  return r.json();
};

function badge(cls, label) { return `<span class="badge ${cls}">${label}</span>`; }

function render() {
  $("#filters").innerHTML = FILTERS.map(([k, label]) =>
    `<button class="chip ${k === active ? "active" : ""}" onclick="setFilter('${k}')">${label}</button>`).join(" ");

  const counter = $("#counter");
  counter.textContent = `${stats.sent_today ?? 0} DMs today`;
  counter.className = (stats.sent_today ?? 0) >= 30 ? "warn" : "";
  if ((stats.sent_today ?? 0) >= 30) counter.textContent += " — slow down";

  $("#statbar").innerHTML = [
    [stats.total ?? 0, "Total", false],
    [stats.no_site ?? 0, "No website", true],
    [stats.sent_today ?? 0, "Sent today", false],
    [stats.replied ?? 0, "Replied", false],
  ].map(([n, l, hot]) => `<div class="stat${hot ? " hot" : ""}"><span class="n">${(+n).toLocaleString()}</span><span class="l">${l}</span></div>`).join("");

  // per-region to-contact counts
  const counts = {};
  for (const l of leads) if (l.state && l.status === "new") counts[l.state] = (counts[l.state] ?? 0) + 1;

  // dedicated Country dropdown — only lists countries that actually have leads
  const usTotal = leads.filter((l) => l.status === "new" && US_STATES.includes(l.state)).length;
  const presentCountries = COUNTRIES.filter((c) => counts[c]);
  const usSelected = stateFilter === "__us__" || US_STATES.includes(stateFilter);
  $("#countrySel").innerHTML =
    `<option value="all" ${stateFilter === "all" ? "selected" : ""}>🌍 All locations</option>` +
    `<option value="__us__" ${usSelected ? "selected" : ""}>🇺🇸 United States (${usTotal})</option>` +
    presentCountries.map((c) => `<option value="${c}" ${c === stateFilter ? "selected" : ""}>${c} (${counts[c]})</option>`).join("");

  // US state dropdown (only meaningful when viewing the US)
  const sel = $("#stateSel");
  sel.innerHTML = `<option value="all">All US states (${usTotal})</option>` +
    US_STATES.map((s) => `<option value="${s}" ${s === stateFilter ? "selected" : ""}>${s} (${counts[s] ?? 0})</option>`).join("");

  // populate the business-type dropdown from whatever niches are actually present
  const nicheCounts = {};
  for (const l of leads) if (l.niche && l.status === "new") nicheCounts[l.niche] = (nicheCounts[l.niche] ?? 0) + 1;
  const nicheList = Object.keys(nicheCounts).sort();
  const nsel = $("#nicheSel");
  nsel.innerHTML = `<option value="all">All types</option>` +
    nicheList.map((n) => `<option value="${n}" ${n === nicheFilter ? "selected" : ""}>${n} (${nicheCounts[n]})</option>`).join("");

  // contact-channel dropdown: work Instagram and phone leads separately
  const igCount = leads.filter((l) => l.ig_handle && l.status === "new").length;
  const phoneCount = leads.filter((l) => !l.ig_handle && l.phone && l.status === "new").length;
  $("#chanSel").innerHTML =
    `<option value="all" ${chanFilter === "all" ? "selected" : ""}>All channels</option>` +
    `<option value="ig" ${chanFilter === "ig" ? "selected" : ""}>📷 On Instagram (${igCount})</option>` +
    `<option value="phone" ${chanFilter === "phone" ? "selected" : ""}>📱 Phone only (${phoneCount})</option>`;

  const shown = leads.filter((l) => {
    if (stateFilter === "__us__") { if (!US_STATES.includes(l.state)) return false; }
    else if (stateFilter !== "all" && l.state !== stateFilter) return false;
    if (nicheFilter !== "all" && l.niche !== nicheFilter) return false;
    if (chanFilter === "ig" && !l.ig_handle) return false;
    if (chanFilter === "phone" && l.ig_handle) return false;
    if (active === "all") return true;
    if (active === "new") return l.status === "new";
    if (active === "sent" || active === "replied") return l.status === active;
    return l.category === active && l.status === "new";
  });

  // Only render a chunk of cards at a time — rendering thousands of textareas
  // at once is what made the page lag. A "Show more" button reveals the rest.
  if (!shown.length) {
    $("#list").innerHTML = `<div class="empty">Nothing here yet. Run a scan to add leads.</div>`;
    return;
  }
  const slice = shown.slice(0, renderLimit);
  let html = slice.map(card).join("");
  if (shown.length > renderLimit) {
    html += `<button class="ghost more" onclick="showMore()">Show more — ${(shown.length - renderLimit).toLocaleString()} of ${shown.length.toLocaleString()} remaining</button>`;
  }
  $("#list").innerHTML = html;
}

window.showMore = () => { renderLimit += 60; render(); };

function card(l) {
  const cat = l.category ? badge(l.category, ({no_site:"NO SITE",bad_site:`WEAK SITE ${l.site_score}`,ok_site:`OK SITE ${l.site_score}`})[l.category]) : "";
  const st = l.status !== "new" ? badge(l.status, l.status.toUpperCase()) : "";
  return `<div class="card" id="lead-${l.id}">
    <div class="chead">
      <span class="name">${esc(l.name)}</span> ${cat} ${st}
      ${l.rating ? `<span class="rating">★ ${l.rating}${l.reviews ? ` (${l.reviews})` : ""}</span>` : ""}
    </div>
    <div class="meta">
      ${esc(l.niche ?? "")} · ${esc(l.area ?? "")}
      ${l.website ? ` · <a href="${esc(l.website)}" target="_blank" rel="noopener">website</a>` : ""}
      ${l.maps_url ? ` · <a href="${esc(l.maps_url)}" target="_blank" rel="noopener">maps</a>` : ""}
      ${l.site_notes && l.category !== "no_site" ? ` · ${esc(l.site_notes)}` : ""}
    </div>
    <div class="contact">
      ${l.ig_handle
        ? `<a class="pill ig" href="https://instagram.com/${esc(l.ig_handle)}" target="_blank" rel="noopener">📷 @${esc(l.ig_handle)}</a>`
        : `<input class="ig" placeholder="@handle" onchange="saveIg(${l.id}, this.value)" />
           <button class="ghost" onclick="findIg(${l.id})">🔎 Find on IG</button>`}
      ${l.phone ? `<a class="pill" href="tel:${esc(phoneDigits(l.phone))}">📞 ${esc(l.phone)}</a>` : ""}
    </div>
    <textarea onchange="saveMsg(${l.id}, this.value)">${esc(msgFor(l))}</textarea>
    <div class="btns">
      ${l.ig_handle ? `<button class="primary" onclick="copyOpen(${l.id}, this)">Copy + open IG</button>` : ""}
      ${l.phone ? `<button class="primary" onclick="copyText2(${l.id}, this)">Copy + text</button>` : ""}
      <button class="ok" onclick="setStatus(${l.id}, 'sent')">✓ Mark sent</button>
      <span class="spacer"></span>
      <button class="ghost" onclick="setStatus(${l.id}, 'replied')">Replied</button>
      <button class="danger" onclick="setStatus(${l.id}, 'skip')">Skip</button>
    </div>
  </div>`;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function phoneDigits(p) { return String(p).replace(/[^\d+]/g, ""); }

// One simple, friendly template so no lead is ever blank.
function msgFor(l) {
  const name = l.name || "your business";
  // A business that's ON Instagram usually has a website linked in their bio even
  // when Google Maps shows none — so NEVER tell them "you don't have a website."
  // Use a neutral pitch that works whether it's a first site or an upgrade.
  if (l.ig_handle) {
    if (l.message && l.message.trim() && !/(don'?t|doesn'?t|do not|does not)\s+have\s+(a\s+)?(website|site|one)/i.test(l.message))
      return l.message;
    return `Hey! I design clean, modern websites for local ${l.niche ?? "businesses"} and came across ${name}. I'd love to put together a free mockup showing what a polished site could look like for you — whether it's a first site or an upgrade. No pressure at all, just thought it might be useful!`;
  }
  if (l.message && l.message.trim()) return l.message;
  if (l.category === "bad_site")
    return `Hey! I design websites for local businesses and noticed ${name}'s site could use a refresh. I'd love to put together a free mockup so you can see what an updated version could look like — no pressure at all. Let me know if you're interested!`;
  return `Hey! I design websites for local businesses and noticed ${name} doesn't have one yet. I'd love to put together a free mockup so you can see what it could look like — no pressure at all. Let me know if you're interested!`;
}

window.setFilter = (k) => { active = k; renderLimit = 60; render(); };
window.setState = (s) => { stateFilter = s; renderLimit = 60; render(); };
window.setCountry = (c) => { stateFilter = c === "all" ? "all" : c; renderLimit = 60; render(); };
window.setNiche = (n) => { nicheFilter = n; renderLimit = 60; render(); };
window.setChan = (c) => { chanFilter = c; renderLimit = 60; render(); };

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // fallback for browsers/contexts where the clipboard API is blocked
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

// Where "open IG" should go. If we have a verified handle, the profile.
// Otherwise a Google search for the business — Instagram's own keyword-search
// URL just redirects to a login wall, which is the wrong place to land.
function igDestination(l) {
  if (l.ig_handle) return `https://instagram.com/${l.ig_handle}`;
  const q = encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`);
  return `https://www.google.com/search?q=${q}`;
}

window.copyOpen = async (id, btn) => {
  const l = leads.find((x) => x.id === id);

  // Open the tab FIRST, synchronously inside the click — if we await the copy
  // before opening, the browser no longer sees a user gesture and the popup
  // blocker kills it. Have the handle → their profile; no handle → a Google
  // search that surfaces their real account (IG's own keyword search is useless).
  const dest = l.ig_handle
    ? `https://www.instagram.com/${l.ig_handle}/`
    : `https://www.google.com/search?q=${encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`)}`;
  window.open(dest, "_blank");

  const ok = await copyText(msgFor(l));

  if (btn) {
    const original = btn.textContent;
    const done = l.ig_handle ? "✓ Copied — opened their IG" : "✓ Copied — no handle yet, Google opened";
    btn.textContent = ok ? done : "Copy failed — select manually";
    btn.style.background = ok ? "var(--accent)" : "var(--red)";
    btn.style.color = ok ? "#07150f" : "#fff";
    setTimeout(() => { btn.textContent = original; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }
};

window.copyText2 = async (id, btn) => {
  const l = leads.find((x) => x.id === id);
  // open the Messages app FIRST (before the await) so the popup blocker doesn't
  // kill it, with the number + the message pre-filled
  window.open(`sms:${phoneDigits(l.phone)}?&body=${encodeURIComponent(msgFor(l))}`, "_blank");
  const ok = await copyText(msgFor(l));
  if (btn) {
    const original = btn.textContent;
    btn.textContent = ok ? "✓ Copied — texting them" : "Copy failed — select manually";
    btn.style.background = ok ? "var(--accent)" : "var(--red)";
    btn.style.color = ok ? "#07150f" : "#fff";
    setTimeout(() => { btn.textContent = original; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }
};

window.setStatus = async (id, status) => {
  // update in memory + repaint instead of re-downloading all 6k+ leads
  const l = leads.find((x) => x.id === id);
  if (l) l.status = status;
  render();
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ status }) });
  stats = await api("/api/stats"); // light refresh for the counters
  render();
};
window.saveMsg = (id, message) => {
  const l = leads.find((x) => x.id === id);
  if (l) l.message = message;
  return api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ message }) });
};
window.findIg = (id) => {
  const l = leads.find((x) => x.id === id);
  const q = encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`);
  window.open(`https://www.google.com/search?q=${q}`, "_blank");
};
window.saveIg = async (id, ig_handle) => {
  const l = leads.find((x) => x.id === id);
  if (l) l.ig_handle = ig_handle.replace(/^@/, "");
  render();
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ ig_handle }) });
};
window.logout = async () => {
  await fetch("/api/logout", { method: "POST" });
  location.reload();
};

async function load() {
  [leads, stats] = await Promise.all([api("/api/leads"), api("/api/stats")]);
  render();
}
load();
</script>
</body>
</html>
