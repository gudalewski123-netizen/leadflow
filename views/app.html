<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --card: #121212; --elevated: #1a1a1a; --border: #1f1f1f;
    --text: #f8fafc; --muted: #8c8c8c; --accent: #46c79a; --accent-soft: rgba(70,199,154,.13);
    --red: #f87171; --amber: #e6c34d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; background: rgba(13,13,13,.82); backdrop-filter: blur(12px);
    padding: 12px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; z-index: 5;
  }
  .logo { display: flex; align-items: center; gap: 9px; margin-right: 6px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5fd9ad, #2fae82); color: #07150f; font-weight: 800; font-size: 15px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.4px; font-weight: 700; }
  .chip {
    border: 1px solid var(--border); background: var(--elevated); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .12s;
  }
  .chip:hover { border-color: #333; color: var(--text); }
  .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  select.state {
    background: var(--elevated); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  select.state:hover { border-color: #333; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #counter { font-size: 13px; color: var(--muted); font-weight: 500; }
  #counter.warn { color: var(--amber); font-weight: 600; }
  .logout { background: var(--elevated); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .logout:hover { border-color: #333; color: var(--text); }
  #statbar { max-width: 960px; margin: 22px auto 0; padding: 0 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat .n { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; transition: border-color .15s; }
  .card:hover { border-color: #2c2c2c; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 700; font-size: 15.5px; letter-spacing: -0.2px; }
  .badge { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
  .badge.no_site { background: rgba(255,123,196,.13); color: #ff8fce; }
  .badge.bad_site { background: rgba(230,195,77,.12); color: #e6c34d; }
  .badge.ok_site { background: rgba(56,189,248,.12); color: #38bdf8; }
  .badge.sent { background: var(--accent-soft); color: var(--accent); }
  .badge.replied { background: rgba(56,189,248,.12); color: #38bdf8; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .meta a:hover { text-decoration: underline; }
  textarea {
    width: 100%; margin-top: 12px; background: #0a0a0a; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px;
    font: 13.5px/1.5 'Inter', system-ui, sans-serif; resize: vertical; min-height: 70px;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { border: 0; border-radius: 9px; padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .12s; }
  .primary { background: var(--accent); color: #07150f; }
  .primary:hover { background: #54d4a8; }
  .ghost { background: var(--elevated); border: 1px solid var(--border); color: var(--muted); }
  .ghost:hover { border-color: #333; color: var(--text); }
  .ok { background: var(--accent-soft); border: 1px solid rgba(70,199,154,.3); color: var(--accent); }
  .ok:hover { background: rgba(70,199,154,.2); }
  .danger { background: var(--elevated); border: 1px solid var(--border); color: var(--red); }
  .danger:hover { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); }
  input.ig { background: #0a0a0a; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: inherit; width: 170px; }
  input.ig:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .empty { text-align: center; color: var(--muted); padding: 70px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="mark">L</div><h1>LeadFlow</h1></div>
  <div id="filters"></div>
  <select class="state" id="stateSel" onchange="setState(this.value)"></select>
  <select class="state" id="nicheSel" onchange="setNiche(this.value)"></select>
  <div class="right">
    <span id="counter"></span>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</header>
<div id="statbar"></div>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const FILTERS = [
  ["new", "To contact"], ["no_site", "No website"], ["bad_site", "Bad site"],
  ["sent", "Sent"], ["replied", "Replied"], ["all", "All"],
];
let leads = [], active = "no_site", stateFilter = "all", nicheFilter = "all", stats = {};
const US_STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];

const $ = (s) => document.querySelector(s);
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.reload(); throw new Error("unauthorized"); }
  return r.json();
};

function badge(cls, label) { return `<span class="badge ${cls}">${label}</span>`; }

function render() {
  $("#filters").innerHTML = FILTERS.map(([k, label]) =>
    `<button class="chip ${k === active ? "active" : ""}" onclick="setFilter('${k}')">${label}</button>`).join(" ");

  const counter = $("#counter");
  counter.textContent = `${stats.sent_today ?? 0} DMs today`;
  counter.className = (stats.sent_today ?? 0) >= 30 ? "warn" : "";
  if ((stats.sent_today ?? 0) >= 30) counter.textContent += " — slow down";

  $("#statbar").innerHTML = [
    [stats.total ?? 0, "Total leads"],
    [stats.to_contact ?? 0, "To contact"],
    [stats.no_site ?? 0, "No website"],
    [stats.sent_today ?? 0, "Sent today"],
    [stats.replied ?? 0, "Replied"],
  ].map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  // populate the state dropdown with per-state to-contact counts
  const counts = {};
  for (const l of leads) if (l.state && l.status === "new") counts[l.state] = (counts[l.state] ?? 0) + 1;
  const sel = $("#stateSel");
  sel.innerHTML = `<option value="all">All states (${leads.filter((l) => l.status === "new").length})</option>` +
    US_STATES.map((s) => `<option value="${s}" ${s === stateFilter ? "selected" : ""}>${s} (${counts[s] ?? 0})</option>`).join("");

  // populate the business-type dropdown from whatever niches are actually present
  const nicheCounts = {};
  for (const l of leads) if (l.niche && l.status === "new") nicheCounts[l.niche] = (nicheCounts[l.niche] ?? 0) + 1;
  const nicheList = Object.keys(nicheCounts).sort();
  const nsel = $("#nicheSel");
  nsel.innerHTML = `<option value="all">All types</option>` +
    nicheList.map((n) => `<option value="${n}" ${n === nicheFilter ? "selected" : ""}>${n} (${nicheCounts[n]})</option>`).join("");

  const shown = leads.filter((l) => {
    if (stateFilter !== "all" && l.state !== stateFilter) return false;
    if (nicheFilter !== "all" && l.niche !== nicheFilter) return false;
    if (active === "all") return true;
    if (active === "new") return l.status === "new";
    if (active === "sent" || active === "replied") return l.status === active;
    return l.category === active && l.status === "new";
  });

  $("#list").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty">Nothing here yet. Run a scan to add leads.</div>`;
}

function card(l) {
  const cat = l.category ? badge(l.category, ({no_site:"NO SITE",bad_site:`WEAK SITE ${l.site_score}`,ok_site:`OK SITE ${l.site_score}`})[l.category]) : "";
  const st = l.status !== "new" ? badge(l.status, l.status.toUpperCase()) : "";
  return `<div class="card" id="lead-${l.id}">
    <div class="row">
      <span class="name">${esc(l.name)}</span> ${cat} ${st}
      ${l.rating ? `<span class="meta">★ ${l.rating}${l.reviews ? ` (${l.reviews})` : ""}</span>` : ""}
    </div>
    <div class="meta">
      ${esc(l.niche ?? "")} · ${esc(l.area ?? "")}
      ${l.website ? ` · <a href="${esc(l.website)}" target="_blank" rel="noopener">site</a>` : ""}
      ${l.maps_url ? ` · <a href="${esc(l.maps_url)}" target="_blank" rel="noopener">maps</a>` : ""}
      ${l.site_notes ? ` · ${esc(l.site_notes)}` : ""}
    </div>
    <div class="row" style="margin-top:8px">
      ${l.ig_handle
        ? `<a class="meta" href="https://instagram.com/${esc(l.ig_handle)}" target="_blank" rel="noopener">@${esc(l.ig_handle)}</a>`
        : `<input class="ig" placeholder="@handle" onchange="saveIg(${l.id}, this.value)" />
           <button class="ghost" style="padding:5px 10px" onclick="findIg(${l.id})">🔎 Find on IG</button>`}
      ${l.phone ? `<a class="meta" href="tel:${esc(phoneDigits(l.phone))}">📞 ${esc(l.phone)}</a>` : ""}
    </div>
    <textarea onchange="saveMsg(${l.id}, this.value)">${esc(msgFor(l))}</textarea>
    <div class="btns">
      ${l.ig_handle
        ? `<button class="primary" onclick="copyOpen(${l.id}, this)">Copy msg + open IG</button>`
        : ""}
      ${l.phone ? `<button class="primary" onclick="copyText2(${l.id}, this)">Copy msg + text 📱</button>` : ""}
      <button class="ok" onclick="setStatus(${l.id}, 'sent')">Mark sent</button>
      <button class="ghost" onclick="setStatus(${l.id}, 'replied')">Replied</button>
      <button class="danger" onclick="setStatus(${l.id}, 'skip')">Skip</button>
    </div>
  </div>`;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function phoneDigits(p) { return String(p).replace(/[^\d+]/g, ""); }

// One simple, friendly template so no lead is ever blank. Uses the AI draft if
// one exists, otherwise fills the business name into a clean default.
function msgFor(l) {
  if (l.message && l.message.trim()) return l.message;
  const name = l.name || "your business";
  if (l.category === "bad_site")
    return `Hey! I design websites for local businesses and noticed ${name}'s site could use a refresh. I'd love to put together a free mockup so you can see what an updated version could look like — no pressure at all. Let me know if you're interested!`;
  return `Hey! I design websites for local businesses and noticed ${name} doesn't have one yet. I'd love to put together a free mockup so you can see what it could look like — no pressure at all. Let me know if you're interested!`;
}

window.setFilter = (k) => { active = k; render(); };
window.setState = (s) => { stateFilter = s; render(); };
window.setNiche = (n) => { nicheFilter = n; render(); };

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // fallback for browsers/contexts where the clipboard API is blocked
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

// Where "open IG" should go. If we have a verified handle, the profile.
// Otherwise a Google search for the business — Instagram's own keyword-search
// URL just redirects to a login wall, which is the wrong place to land.
function igDestination(l) {
  if (l.ig_handle) return `https://instagram.com/${l.ig_handle}`;
  const q = encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`);
  return `https://www.google.com/search?q=${q}`;
}

window.copyOpen = async (id, btn) => {
  const l = leads.find((x) => x.id === id);

  // Open the tab FIRST, synchronously inside the click — if we await the copy
  // before opening, the browser no longer sees a user gesture and the popup
  // blocker kills it. Have the handle → their profile; no handle → a Google
  // search that surfaces their real account (IG's own keyword search is useless).
  const dest = l.ig_handle
    ? `https://www.instagram.com/${l.ig_handle}/`
    : `https://www.google.com/search?q=${encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`)}`;
  window.open(dest, "_blank");

  const ok = await copyText(msgFor(l));

  if (btn) {
    const original = btn.textContent;
    const done = l.ig_handle ? "✓ Copied — opened their IG" : "✓ Copied — no handle yet, Google opened";
    btn.textContent = ok ? done : "Copy failed — select manually";
    btn.style.background = ok ? "var(--accent)" : "var(--red)";
    btn.style.color = ok ? "#07150f" : "#fff";
    setTimeout(() => { btn.textContent = original; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }
};

window.copyText2 = async (id, btn) => {
  const l = leads.find((x) => x.id === id);
  // open the Messages app FIRST (before the await) so the popup blocker doesn't
  // kill it, with the number + the message pre-filled
  window.open(`sms:${phoneDigits(l.phone)}?&body=${encodeURIComponent(msgFor(l))}`, "_blank");
  const ok = await copyText(msgFor(l));
  if (btn) {
    const original = btn.textContent;
    btn.textContent = ok ? "✓ Copied — texting them" : "Copy failed — select manually";
    btn.style.background = ok ? "var(--accent)" : "var(--red)";
    btn.style.color = ok ? "#07150f" : "#fff";
    setTimeout(() => { btn.textContent = original; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }
};

window.setStatus = async (id, status) => {
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ status }) });
  await load();
};
window.saveMsg = (id, message) =>
  api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ message }) });
window.findIg = (id) => {
  const l = leads.find((x) => x.id === id);
  const q = encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`);
  window.open(`https://www.google.com/search?q=${q}`, "_blank");
};
window.saveIg = async (id, ig_handle) => {
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ ig_handle }) });
  await load();
};
window.logout = async () => {
  await fetch("/api/logout", { method: "POST" });
  location.reload();
};

async function load() {
  [leads, stats] = await Promise.all([api("/api/leads"), api("/api/stats")]);
  render();
}
load();
</script>
</body>
</html>
