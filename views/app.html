<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0b; --surface:#131315; --surface-2:#1a1a1d; --surface-3:#212125;
    --border:#242427; --border-2:#33333a;
    --text:#f2f2f4; --muted:#8b8b94; --faint:#5c5c65;
    --accent:#46c79a; --accent-2:#5fd9ad; --accent-soft:rgba(70,199,154,.11);
    --red:#f87171; --amber:#e0b84a; --pink:#ff8fce; --sky:#5cb8f0;
    --r:10px;
  }
  * { box-sizing:border-box }
  ::selection { background:var(--accent-soft) }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px;
    font-variant-numeric:tabular-nums; }

  /* ---------- header ---------- */
  header { position:sticky; top:0; z-index:10; background:rgba(10,10,11,.86);
           -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
           border-bottom:1px solid var(--border) }
  .topbar,.toolbar { max-width:1060px; margin:0 auto; padding:9px 20px;
                     display:flex; align-items:center; gap:11px; flex-wrap:wrap }
  .toolbar { gap:9px; padding-top:0; padding-bottom:10px }
  .logo { display:flex; align-items:center; gap:9px; margin-right:2px }
  .mark { width:27px; height:27px; border-radius:8px; display:grid; place-items:center;
          background:linear-gradient(140deg,var(--accent-2),#2a9b74); color:#04120c;
          font-weight:800; font-size:14px }
  h1 { font-size:15.5px; margin:0; letter-spacing:-.3px; font-weight:700 }
  #statbar { display:flex; gap:6px; flex-wrap:wrap; margin-left:4px }
  .stat { display:flex; align-items:baseline; gap:5px; padding:4px 9px; border-radius:7px;
          background:var(--surface-2); border:1px solid var(--border) }
  .stat .n { font-size:13px; font-weight:700; letter-spacing:-.2px }
  .stat.hot .n { color:var(--accent) }
  .stat .l { font-size:9.5px; color:var(--faint); text-transform:uppercase;
             letter-spacing:.6px; font-weight:700 }
  .right { margin-left:auto; display:flex; align-items:center; gap:10px }
  #counter { font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap }
  #counter.warn { color:var(--amber); font-weight:600 }
  .logout { background:transparent; border:1px solid var(--border); color:var(--muted);
            border-radius:7px; padding:6px 11px; font-size:12px; font-weight:600;
            cursor:pointer; transition:all .12s }
  .logout:hover { border-color:var(--border-2); color:var(--text) }

  .seg { display:inline-flex; background:var(--surface-2); border:1px solid var(--border);
         border-radius:8px; padding:3px; gap:2px }
  .chip { border:0; background:transparent; color:var(--muted); border-radius:6px;
          padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; transition:all .12s }
  .chip:hover { color:var(--text) }
  .chip.active { background:var(--accent); color:#04120c }
  .selects { margin-left:auto; display:flex; gap:7px; flex-wrap:wrap }
  select.state { background:var(--surface-2); color:var(--text); border:1px solid var(--border);
                 border-radius:7px; padding:6px 10px; font-size:12px; font-weight:600;
                 cursor:pointer; transition:all .12s }
  select.state:hover { border-color:var(--border-2) }

  /* ---------- the list ---------- */
  main { max-width:1060px; margin:16px auto 80px; padding:0 20px;
         display:flex; flex-direction:column; gap:9px }

  /* A card carries a score rail down its left edge — the one glanceable signal
     while working a list of hundreds. Colour only where it means something. */
  .card { position:relative; background:var(--surface); border:1px solid var(--border);
          border-radius:var(--r); padding:14px 16px 14px 18px; scroll-margin:88px;
          transition:border-color .13s, background .13s }
  .card::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px;
                  border-radius:0 3px 3px 0; background:var(--border-2) }
  .card.s-hi::before { background:var(--accent) }
  .card.s-mid::before { background:rgba(70,199,154,.45) }
  .card:hover { border-color:var(--border-2) }
  .card.on { border-color:var(--accent); background:var(--surface-2) }

  .chead { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  .score { flex:0 0 auto; min-width:30px; height:22px; padding:0 7px; border-radius:6px;
           display:grid; place-items:center; font-size:12px; font-weight:800;
           letter-spacing:-.2px; background:var(--surface-3); color:var(--muted) }
  .score.s-hi { background:var(--accent); color:#04120c }
  .score.s-mid { background:var(--accent-soft); color:var(--accent) }
  .name { font-weight:650; font-size:14.5px; letter-spacing:-.2px }
  .rating { color:var(--faint); font-size:12px; font-weight:500 }
  .badge { font-size:9.5px; padding:2.5px 7px; border-radius:5px; font-weight:700;
           letter-spacing:.45px; text-transform:uppercase }
  .badge.no_site { background:rgba(255,143,206,.12); color:var(--pink) }
  .badge.bad_site { background:rgba(224,184,74,.11); color:var(--amber) }
  .badge.ok_site { background:rgba(92,184,240,.1); color:var(--sky) }
  .badge.sent { background:var(--accent-soft); color:var(--accent) }
  .badge.replied { background:rgba(92,184,240,.11); color:var(--sky) }
  .meta { color:var(--muted); font-size:12px; margin-top:4px }
  .meta a { color:var(--accent); text-decoration:none; font-weight:500 }
  .meta a:hover { text-decoration:underline }

  /* why it scored — the reasons as their own chips, the money signal lit up */
  .why { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px }
  .w { font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px;
       background:var(--surface-2); color:var(--muted); border:1px solid transparent }
  .w.key { background:var(--accent-soft); color:var(--accent); border-color:rgba(70,199,154,.22) }
  .w.warn { background:rgba(224,184,74,.1); color:var(--amber) }

  .stale { margin:8px 0 0; padding:6px 9px; border-left:2px solid var(--amber);
           background:rgba(224,184,74,.07); border-radius:0 5px 5px 0;
           font-size:11.5px; line-height:1.45; color:var(--amber) }
  .stale b { color:#f0cf7a }

  .contact { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:9px }
  .pill { display:inline-flex; align-items:center; gap:5px; background:var(--surface-2);
          border:1px solid var(--border); border-radius:6px; padding:4px 9px;
          font-size:12px; font-weight:600; color:var(--text); text-decoration:none }
  .pill.ig { color:var(--accent) }
  .pill:hover { border-color:var(--border-2) }

  textarea { width:100%; margin-top:10px; background:var(--bg); color:var(--text);
             border:1px solid var(--border); border-radius:8px; padding:10px 11px;
             font:13px/1.55 'Inter',system-ui,sans-serif; resize:vertical; min-height:62px }
  textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft) }
  input.ig { background:var(--bg); border:1px solid var(--border); color:var(--text);
             border-radius:6px; padding:5px 9px; font-size:12px; font-family:inherit; width:145px }
  input.ig:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft) }

  .btns { display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; align-items:center }
  button { border:0; border-radius:7px; padding:8px 13px; font-size:12.5px; font-weight:650;
           cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap }
  .primary { background:var(--accent); color:#04120c }
  .primary:hover { background:var(--accent-2) }
  .ghost { background:transparent; border:1px solid var(--border); color:var(--muted); padding:7px 11px }
  .ghost:hover { border-color:var(--border-2); color:var(--text) }
  .ok { background:transparent; border:1px solid rgba(70,199,154,.3); color:var(--accent) }
  .ok:hover { background:var(--accent-soft) }
  .danger { background:transparent; border:1px solid var(--border); color:var(--faint); padding:7px 11px }
  .danger:hover { color:var(--red); border-color:rgba(248,113,113,.3) }
  .spacer { flex:1 }
  .more { align-self:center; margin:8px auto 0 }
  .empty { text-align:center; color:var(--muted); padding:80px 0; font-size:14px }

  /* keyboard hint — the tool is worked at volume, so say the keys out loud */
  .keys { position:fixed; right:14px; bottom:12px; z-index:9; display:flex; gap:10px;
          padding:6px 11px; border-radius:8px; background:rgba(19,19,21,.92);
          border:1px solid var(--border); font-size:10.5px; color:var(--faint);
          -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
  .keys kbd { font:inherit; font-weight:700; color:var(--muted); background:var(--surface-3);
              border-radius:4px; padding:1px 5px; margin-right:3px }
  @media (max-width:760px) { .keys { display:none } }
  @media (max-width:640px) {
    .topbar { flex-wrap:wrap; height:auto; padding:9px 14px }
    #statbar { width:100%; order:3 }
    .toolbar { padding:0 14px 9px }
    main { padding:0 14px }
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo"><div class="mark">L</div><h1>LeadFlow</h1></div>
    <div id="statbar"></div>
    <div class="right">
      <span id="counter"></span>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </div>
  <div class="toolbar">
    <div id="filters" class="seg"></div>
    <div class="selects">
      <select class="state" id="countrySel" onchange="setCountry(this.value)"></select>
      <select class="state" id="stateSel" onchange="setState(this.value)"></select>
      <select class="state" id="nicheSel" onchange="setNiche(this.value)"></select>
      <select class="state" id="chanSel" onchange="setChan(this.value)"></select>
      <select class="state" id="revSel" onchange="setMinRev(this.value)">
        <option value="0">Any reviews</option>
        <option value="5">★ 5+ reviews</option>
        <option value="15">★ 15+ reviews</option>
        <option value="40">★ 40+ reviews</option>
        <option value="100">★ 100+ reviews</option>
      </select>
    </div>
  </div>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<div class="keys" aria-hidden="true">
  <span><kbd>J</kbd><kbd>K</kbd>move</span><span><kbd>C</kbd>copy + open</span>
  <span><kbd>S</kbd>sent</span><span><kbd>R</kbd>replied</span><span><kbd>X</kbd>skip</span>
</div>
<script>
const FILTERS = [
  ["new", "To contact"], ["hot", "🔥 Hot"], ["new_business", "🌱 New Biz"], ["no_site", "No website"], ["no_aeo", "No AEO"], ["bad_site", "Bad site"],
  ["sent", "Sent"], ["replied", "Replied"], ["all", "All"],
];
let pageLeads = [], active = "no_site", stateFilter = "all", nicheFilter = "all", chanFilter = "all", minRev = 0;
let stats = {}, facets = { regionCounts: {}, nicheCounts: {}, ig: 0, phone: 0 };
let total = 0, offset = 0, loading = false;
const PAGE = 60;
const US_STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
const COUNTRIES = ["United Kingdom","Ireland","Poland","Germany","France","Spain","Italy","Netherlands","Belgium","Portugal","Switzerland","Austria","Sweden","Norway","Denmark","Finland","Czechia","Romania","Greece","Canada","Mexico","Brazil","Australia","New Zealand","United Arab Emirates","South Africa"];

const $ = (s) => document.querySelector(s);
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.reload(); throw new Error("unauthorized"); }
  return r.json();
};

function badge(cls, label) { return `<span class="badge ${cls}">${label}</span>`; }

function render() {
  $("#filters").innerHTML = FILTERS.map(([k, label]) =>
    `<button class="chip ${k === active ? "active" : ""}" onclick="setFilter('${k}')">${label}</button>`).join(" ");

  const counter = $("#counter");
  counter.textContent = `${stats.sent_today ?? 0} DMs today`;
  counter.className = (stats.sent_today ?? 0) >= 30 ? "warn" : "";
  if ((stats.sent_today ?? 0) >= 30) counter.textContent += " — slow down";

  $("#statbar").innerHTML = [
    [stats.total ?? 0, "Total", false],
    [stats.no_site ?? 0, "No website", false],
    [stats.hot ?? 0, "🔥 Hot", true],
    [stats.new_business ?? 0, "🌱 New Biz", false],
    [stats.sent_today ?? 0, "Sent today", false],
    [stats.replied ?? 0, "Replied", false],
  ].map(([n, l, hot]) => `<div class="stat${hot ? " hot" : ""}"><span class="n">${(+n).toLocaleString()}</span><span class="l">${l}</span></div>`).join("");

  // dropdown counts come from /api/facets (computed in SQL over the to-contact pool)
  const counts = facets.regionCounts || {};
  const usTotal = US_STATES.reduce((n, s) => n + (counts[s] ?? 0), 0);
  const presentCountries = COUNTRIES.filter((c) => counts[c]);
  const usSelected = stateFilter === "__us__" || US_STATES.includes(stateFilter);
  $("#countrySel").innerHTML =
    `<option value="all" ${stateFilter === "all" ? "selected" : ""}>🌍 All locations</option>` +
    `<option value="__us__" ${usSelected ? "selected" : ""}>🇺🇸 United States (${usTotal.toLocaleString()})</option>` +
    presentCountries.map((c) => `<option value="${c}" ${c === stateFilter ? "selected" : ""}>${c} (${counts[c]})</option>`).join("");

  $("#stateSel").innerHTML = `<option value="all">All US states (${usTotal.toLocaleString()})</option>` +
    US_STATES.map((s) => `<option value="${s}" ${s === stateFilter ? "selected" : ""}>${s} (${counts[s] ?? 0})</option>`).join("");

  const nicheList = Object.keys(facets.nicheCounts || {}).sort();
  $("#nicheSel").innerHTML = `<option value="all">All types</option>` +
    nicheList.map((n) => `<option value="${n}" ${n === nicheFilter ? "selected" : ""}>${n} (${facets.nicheCounts[n]})</option>`).join("");

  $("#chanSel").innerHTML =
    `<option value="all" ${chanFilter === "all" ? "selected" : ""}>All channels</option>` +
    `<option value="ig" ${chanFilter === "ig" ? "selected" : ""}>📷 On Instagram (${(facets.ig ?? 0).toLocaleString()})</option>` +
    `<option value="phone" ${chanFilter === "phone" ? "selected" : ""}>📱 Phone only (${(facets.phone ?? 0).toLocaleString()})</option>`;

  // pageLeads is already filtered + ordered by the server; just render it
  if (!pageLeads.length) {
    $("#list").innerHTML = loading
      ? `<div class="empty">Loading…</div>`
      : `<div class="empty">No leads match these filters.</div>`;
    return;
  }
  let html = pageLeads.map(card).join("");
  if (pageLeads.length < total) {
    html += `<button class="ghost more" onclick="showMore()">${loading ? "Loading…" : `Show more — ${(total - pageLeads.length).toLocaleString()} of ${total.toLocaleString()} remaining`}</button>`;
  }
  $("#list").innerHTML = html;
}

function leadQuery(off) {
  return `/api/leads?status=${active}&region=${encodeURIComponent(stateFilter)}` +
    `&niche=${encodeURIComponent(nicheFilter)}&chan=${chanFilter}&minrev=${minRev}&offset=${off}&limit=${PAGE}`;
}

// load the first page for the current filters (reset)
async function loadPage() {
  loading = true; offset = 0; render();
  const r = await api(leadQuery(0));
  pageLeads = r.leads; total = r.total; offset = r.leads.length;
  loading = false; render();
}

// append the next page
window.showMore = async () => {
  if (loading || pageLeads.length >= total) return;
  loading = true; render();
  const r = await api(leadQuery(offset));
  pageLeads = pageLeads.concat(r.leads); total = r.total; offset += r.leads.length;
  loading = false; render();
};

/* hot_score is frozen at scan time and 40 of its 100 points are "posted
   recently", measured against the clock on the day it was scored. It never
   recalculates, so a card can insist a lead "posted this week" months later.
   Rather than filter those out — which on 2026-09-23 would have cut the Hot
   list from 937 to 99, all of them Google-Maps leads — the card states how
   old the reading is and what the dates actually say, and lets you judge. */
const daysSince = (d) => d ? Math.floor((Date.now() - new Date(d).getTime()) / 86400000) : null;
function staleNote(l) {
  const checked = daysSince(l.ig_checked_at);
  const posted  = daysSince(l.last_active);
  if (checked == null) return "";           // Google-Maps lead: score is review-based, it doesn't rot
  if (checked < 14) return "";              // recent enough to trust as-is
  const said = l.hot_why && /posted this week|posted <2wk/.test(l.hot_why);
  const real = posted == null ? "unknown"
    : posted < 7  ? `${posted}d ago`
    : posted < 60 ? `${Math.round(posted / 7)}wk ago`
    :               `${Math.round(posted / 30)}mo ago`;
  return `<div class="stale">⏳ Instagram last checked ${checked} days ago${
    said ? ` — the "${esc(l.hot_why.split(",")[0].trim())}" reason is that old too` : ""
  }. Last post on record: <b>${real}</b>. Re-scan before trusting the score.</div>`;
}

function card(l) {
  const cat = l.category ? badge(l.category, ({no_site:"NO SITE",bad_site:`WEAK SITE ${l.site_score}`,ok_site:`OK SITE ${l.site_score}`})[l.category]) : "";
  const st = l.status !== "new" ? badge(l.status, l.status.toUpperCase()) : "";
  const band = l.hot_score >= 85 ? "s-hi" : l.hot_score >= 70 ? "s-mid" : "";
  return `<div class="card ${band}" id="lead-${l.id}" data-id="${l.id}" tabindex="-1">
    <div class="chead">
      ${l.hot_score != null ? `<span class="score ${band}" title="Hot score">${l.hot_score}</span>` : ""}
      <span class="name">${esc(l.name)}</span> ${cat} ${st}
      ${l.rating ? `<span class="rating">★ ${l.rating}${l.reviews ? ` (${l.reviews})` : ""}</span>` : ""}
    </div>
    <div class="meta">
      ${esc(l.niche ?? "")} · ${esc(l.area ?? "")}
      ${l.ig_followers ? ` · ${Number(l.ig_followers).toLocaleString()} followers` : ""}
      ${l.website ? ` · <a href="${esc(l.website)}" target="_blank" rel="noopener">website</a>` : ""}
      ${l.maps_url ? ` · <a href="${esc(l.maps_url)}" target="_blank" rel="noopener">maps</a>` : ""}
      ${l.site_notes && l.category !== "no_site" ? ` · ${esc(l.site_notes)}` : ""}
    </div>
    ${whyChips(l)}
    ${staleNote(l)}
    <div class="contact">
      ${l.ig_handle
        ? `<a class="pill ig" href="https://instagram.com/${esc(l.ig_handle)}" target="_blank" rel="noopener">@${esc(l.ig_handle)}</a>`
        : `<input class="ig" placeholder="@handle" onchange="saveIg(${l.id}, this.value)" />
           <button class="ghost" onclick="findIg(${l.id})">Find on IG</button>`}
      ${l.phone ? `<a class="pill" href="tel:${esc(phoneDigits(l.phone))}">${esc(l.phone)}</a>` : ""}
    </div>
    <textarea onchange="saveMsg(${l.id}, this.value)">${esc(msgFor(l))}</textarea>
    <div class="btns">
      ${l.ig_handle ? `<button class="primary" onclick="copyOpen(${l.id}, this)">Copy + open IG</button>` : ""}
      ${l.phone ? `<button class="primary" onclick="copyText2(${l.id}, this)">Copy + text</button>` : ""}
      <button class="ok" onclick="setStatus(${l.id}, 'sent')">✓ Mark sent</button>
      <span class="spacer"></span>
      <button class="ghost" onclick="setStatus(${l.id}, 'replied')">Replied</button>
      <button class="danger" onclick="setStatus(${l.id}, 'skip')">Skip</button>
    </div>
  </div>`;
}

/* hot_why is one comma-joined string the scorer wrote ("posted this week, NO link
   in bio, business acct, 521 followers"). Split it back out so the reasons can be
   scanned at a glance, and light up the one that decides the pitch: whether the
   bio has a website in it. The " | pinned…" suffix is an operator note, not a
   scoring reason, so it is dropped here. */
function whyChips(l) {
  if (!l.hot_why) return "";
  const parts = String(l.hot_why).split("|")[0].split(",")
    .map((x) => x.trim())
    // the follower count is already in the meta line, formatted with commas
    .filter((x) => x && !/^[\d,]+\s+followers$/i.test(x));
  if (!parts.length) return "";
  return `<div class="why">` + parts.map((t) => {
    const key  = /no link in bio|new business/i.test(t);
    const warn = /stale|no post|unreachable/i.test(t);
    return `<span class="w ${key ? "key" : warn ? "warn" : ""}">${esc(t)}</span>`;
  }).join("") + `</div>`;
}

/* ---- keyboard: this list is worked a hundred at a time ----
   j/k move, c fires the primary action, s marks sent, x skips. Ignored while
   typing, so editing a message never triggers a status change. */
let cursor = -1;
function cards() { return [...document.querySelectorAll(".card")]; }
function focusCard(i) {
  const cs = cards(); if (!cs.length) return;
  cursor = Math.max(0, Math.min(i, cs.length - 1));
  cs.forEach((c, n) => c.classList.toggle("on", n === cursor));
  cs[cursor].scrollIntoView({ block: "center", behavior: "smooth" });
}
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); focusCard(cursor + 1); return; }
  if (k === "k" || e.key === "ArrowUp")   { e.preventDefault(); focusCard(cursor - 1); return; }
  const cur = cards()[cursor]; if (!cur) return;
  const id = Number(cur.dataset.id);
  if (k === "c") { e.preventDefault(); const b = cur.querySelector(".primary"); if (b) b.click(); }
  if (k === "s") { e.preventDefault(); setStatus(id, "sent"); }
  if (k === "x") { e.preventDefault(); setStatus(id, "skip"); }
  if (k === "r") { e.preventDefault(); setStatus(id, "replied"); }
});

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function phoneDigits(p) { return String(p).replace(/[^\d+]/g, ""); }

/* Any phrasing that tells the lead they have no website. Kept in one place
   so the draft templates and this fallback cannot disagree about it. */
const CLAIMS_NO_SITE =
  /(don'?t|doesn'?t|do not|does not)\s+have\s+(a\s+)?(website|site|one)|could\s?n'?t\s+find|couldn't find|did\s?n'?t\s+(find|see)|not\s+see\s+(a\s+)?(website|site)|no\s+(website|site)\s+(linked|listed|found)|without\s+a\s+(website|site)/i;

// One simple, friendly template so no lead is ever blank.
function msgFor(l) {
  const name = l.name || "your business";
  // When working the No-AEO list, pitch AI-search visibility, not a new website.
  if (active === "no_aeo") {
    return `Hey! I help local ${l.niche ?? "businesses"} show up when people ask ChatGPT, Siri, or Google's AI for recommendations. I had a look at ${name}'s site and it isn't set up for AI search yet — which is fast becoming how people find businesses. I'd love to show you a quick free example of what it could look like. No pressure at all!`;
  }
  // A business that's ON Instagram usually has a website linked in their bio even
  // when Google Maps shows none — so NEVER tell them "you don't have a website."
  // Use a neutral pitch that works whether it's a first site or an upgrade.
  if (l.ig_handle) {
    /* This guard exists so an IG lead is never told they have no website —
       their bio usually has one even when Google Maps shows none. It only
       matched explicit negations ("you don't have a website"), so the stored
       opener "Couldn't find one linked on your page" walked straight through
       it: on 2026-09-23 all 45 IG hot leads carrying a stored message were
       asserting no-website, and all 45 slipped past. Now it also catches the
       "couldn't find / didn't see / no website" family. */
    if (l.message && l.message.trim() && !CLAIMS_NO_SITE.test(l.message))
      return l.message;
    return `Hey! I design clean, modern websites for local ${l.niche ?? "businesses"} and came across ${name}. I'd love to put together a free mockup showing what a polished site could look like for you — whether it's a first site or an upgrade. No pressure at all, just thought it might be useful!`;
  }
  if (l.message && l.message.trim()) return l.message;
  if (l.category === "bad_site")
    return `Hey! I design websites for local businesses and noticed ${name}'s site could use a refresh. I'd love to put together a free mockup so you can see what an updated version could look like — no pressure at all. Let me know if you're interested!`;
  return `Hey! I design websites for local businesses and noticed ${name} doesn't have one yet. I'd love to put together a free mockup so you can see what it could look like — no pressure at all. Let me know if you're interested!`;
}

window.setFilter = (k) => { active = k; loadPage(); };
window.setState = (s) => { stateFilter = s; loadPage(); };
window.setCountry = (c) => { stateFilter = c === "all" ? "all" : c; loadPage(); };
window.setNiche = (n) => { nicheFilter = n; loadPage(); };
window.setChan = (c) => { chanFilter = c; loadPage(); };
window.setMinRev = (n) => { minRev = +n; loadPage(); };

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // fallback for browsers/contexts where the clipboard API is blocked
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

// Where "open IG" should go. If we have a verified handle, the profile.
// Otherwise a Google search for the business — Instagram's own keyword-search
// URL just redirects to a login wall, which is the wrong place to land.
function igDestination(l) {
  if (l.ig_handle) return `https://instagram.com/${l.ig_handle}`;
  const q = encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`);
  return `https://www.google.com/search?q=${q}`;
}

window.copyOpen = async (id, btn) => {
  const l = pageLeads.find((x) => x.id === id);

  // Open the tab FIRST, synchronously inside the click — if we await the copy
  // before opening, the browser no longer sees a user gesture and the popup
  // blocker kills it. Have the handle → their profile; no handle → a Google
  // search that surfaces their real account (IG's own keyword search is useless).
  const dest = l.ig_handle
    ? `https://www.instagram.com/${l.ig_handle}/`
    : `https://www.google.com/search?q=${encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`)}`;
  window.open(dest, "_blank");

  const ok = await copyText(msgFor(l));

  if (btn) {
    const original = btn.textContent;
    const done = l.ig_handle ? "✓ Copied — opened their IG" : "✓ Copied — no handle yet, Google opened";
    btn.textContent = ok ? done : "Copy failed — select manually";
    btn.style.background = ok ? "var(--accent)" : "var(--red)";
    btn.style.color = ok ? "#07150f" : "#fff";
    setTimeout(() => { btn.textContent = original; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }
};

window.copyText2 = async (id, btn) => {
  const l = pageLeads.find((x) => x.id === id);
  // open the Messages app FIRST (before the await) so the popup blocker doesn't
  // kill it, with the number + the message pre-filled
  window.open(`sms:${phoneDigits(l.phone)}?&body=${encodeURIComponent(msgFor(l))}`, "_blank");
  const ok = await copyText(msgFor(l));
  if (btn) {
    const original = btn.textContent;
    btn.textContent = ok ? "✓ Copied — texting them" : "Copy failed — select manually";
    btn.style.background = ok ? "var(--accent)" : "var(--red)";
    btn.style.color = ok ? "#07150f" : "#fff";
    setTimeout(() => { btn.textContent = original; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }
};

window.setStatus = async (id, status) => {
  // the lead leaves the current view — drop it from the page and repaint instantly
  pageLeads = pageLeads.filter((x) => x.id !== id);
  total = Math.max(0, total - 1);
  render();
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ status }) });
  // refresh the counters + dropdown facets in the background
  [stats, facets] = await Promise.all([api("/api/stats"), api("/api/facets")]);
  render();
};
window.saveMsg = (id, message) => {
  const l = pageLeads.find((x) => x.id === id);
  if (l) l.message = message;
  return api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ message }) });
};
window.findIg = (id) => {
  const l = pageLeads.find((x) => x.id === id);
  const q = encodeURIComponent(`"${l.name}" ${l.area ?? ""} instagram`);
  window.open(`https://www.google.com/search?q=${q}`, "_blank");
};
window.saveIg = async (id, ig_handle) => {
  const l = pageLeads.find((x) => x.id === id);
  if (l) l.ig_handle = ig_handle.replace(/^@/, "");
  render();
  await api(`/api/leads/${id}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ ig_handle }) });
};
window.logout = async () => {
  await fetch("/api/logout", { method: "POST" });
  location.reload();
};

async function load() {
  // fetch stats + dropdown facets + the first page — each is small and fast now
  [stats, facets] = await Promise.all([api("/api/stats"), api("/api/facets")]);
  await loadPage();
}
load();
</script>
