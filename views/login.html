<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --card: #121212; --border: #1f1f1f; --text: #f8fafc;
    --muted: #8c8c8c; --accent: #46c79a; --accent-soft: rgba(70,199,154,.13); --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(1100px 520px at 50% -8%, rgba(70,199,154,.12) 0%, var(--bg) 55%);
    color: var(--text);
  }
  .panel {
    width: min(390px, 92vw); background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 38px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .logo { display: flex; align-items: center; gap: 11px; margin-bottom: 6px; }
  .mark {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5fd9ad, #2fae82); color: #07150f; font-weight: 800; font-size: 18px;
  }
  h1 { font-size: 21px; margin: 0; letter-spacing: -0.4px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 28px; }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 7px; font-weight: 500; }
  input {
    width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: #0a0a0a; color: var(--text); font-size: 15px; font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #07150f; font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: background .12s;
  }
  button:hover { background: #54d4a8; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .foot { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 24px; }
</style>
</head>
<body>
  <form class="panel" id="form">
    <div class="logo"><div class="mark">L</div><h1>LeadFlow</h1></div>
    <div class="sub">Client outreach pipeline · private access</div>
    <label for="pw">Access password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="foot">Authorized users only</div>
  </form>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }),
  });
  if (r.ok) location.reload();
  else err.textContent = r.status === 429 ? "Too fast — try again in a second." : "Wrong password.";
});
</script>
</body>
</html>
