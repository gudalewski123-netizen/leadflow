<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow — Sign in</title>
<style>
  :root { --bg:#f4f4f8; --card:#fff; --ink:#15131f; --muted:#5d5a6d; --line:#e6e4ee; --brand:#7C3AED; --brandbg:#f1eafe; --bad:#b91c1c; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.45 }
  .panel { width:min(400px, 100%); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 22px; text-align:center }
  .mark { width:56px; height:56px; border-radius:14px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; font-size:28px; margin:0 auto 12px }
  h1 { font-size:22px; margin:0 0 6px }
  .sub { color:var(--muted); margin:0 0 18px }
  label { display:block; text-align:left; font-size:13px; color:var(--muted); margin-bottom:5px }
  input { width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 12px; outline:none }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brandbg) }
  button { width:100%; margin-top:12px; font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; background:var(--ink); color:var(--card) }
  .err { color:var(--bad); font-size:14px; min-height:20px; margin-top:10px }
  .lang { display:flex; justify-content:center; gap:4px; margin-top:14px }
  .lang a { font-size:13px; color:var(--muted); padding:4px 8px; border-radius:999px; cursor:pointer; text-decoration:none }
  .lang a.on { color:var(--ink); font-weight:600; background:var(--line) }
</style>
</head>
<body>
  <form class="panel" id="form">
    <div class="mark">L</div><h1>LeadFlow</h1>
    <p class="sub" id="t-sub">Your Instagram leads</p>
    <label for="pw" id="t-pw">Access password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <button type="submit" id="t-btn">Sign in</button>
    <div class="err" id="err"></div>
    <div class="lang"><a id="l-en" onclick="setLang('en')">English</a><a id="l-es" onclick="setLang('es')">Español</a></div>
  </form>
<script>
/* English / Español — same choice as the leads page (localStorage lf_lang) */
const L = { en: { sub: "Your Instagram leads", pw: "Access password", btn: "Sign in", fast: "Too fast — try again in a second.", wrong: "Wrong password." },
            es: { sub: "Tus leads de Instagram", pw: "Contraseña de acceso", btn: "Entrar", fast: "Muy rápido — inténtalo de nuevo en un segundo.", wrong: "Contraseña incorrecta." } };
let lang = (() => { try { return localStorage.getItem("lf_lang") === "es" ? "es" : "en"; } catch { return "en"; } })();
function setLang(l) {
  lang = l; try { localStorage.setItem("lf_lang", l); } catch {}
  document.documentElement.lang = l;
  for (const k of ["sub", "pw", "btn"]) document.getElementById("t-" + k).textContent = L[l][k];
  document.getElementById("l-en").className = l === "en" ? "on" : ""; document.getElementById("l-es").className = l === "es" ? "on" : "";
  document.getElementById("err").textContent = "";
}
setLang(lang);
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }),
  });
  if (r.ok) location.reload();
  else err.textContent = r.status === 429 ? L[lang].fast : L[lang].wrong;
});
</script>
</body>
</html>
