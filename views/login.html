<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeadFlow — Sign in</title>
<style>
  :root {
    --bg: #0c0e12; --card: #14171e; --border: #262b36; --text: #e8eaf0;
    --muted: #9aa3b2; --accent: #4f8ef7; --red: #e0596b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text);
  }
  .panel {
    width: min(380px, 92vw); background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mark {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f8ef7, #7b5cf0); font-weight: 800; font-size: 17px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 4px 0 26px; }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #0e1117; color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .foot { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 22px; }
</style>
</head>
<body>
  <form class="panel" id="form">
    <div class="logo"><div class="mark">L</div><h1>LeadFlow</h1></div>
    <div class="sub">Client outreach pipeline · private access</div>
    <label for="pw">Access password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="foot">Authorized users only</div>
  </form>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }),
  });
  if (r.ok) location.reload();
  else err.textContent = r.status === 429 ? "Too fast — try again in a second." : "Wrong password.";
});
</script>
</body>
</html>
